<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in &middot; Brand</title>
  <meta name="description" content="Log in form.">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script src="../assets/js/main.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div style="position:absolute; top:var(--sp-4); right:var(--sp-4)"><button class="btn ghost icon theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle dark mode">
      <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button></div>
<main class="centered" id="main">
  <div class="auth-card stack" style="--stack:var(--sp-5)">
    <a class="brand" href="landing.html" style="justify-content:center; display:flex"><span class="brand-mark">B</span>Brand</a>
    <div class="card stack" style="padding:var(--sp-6)">
      <div class="center stack" style="--stack:var(--sp-2)"><h2>Welcome back</h2><p class="small muted">Log in to your account</p></div>
      <button class="btn secondary block" type="button">Continue with Google</button>
      <div class="divider">or</div>
      <form class="form" action="#" method="post">
        <div class="field"><label for="email">Email</label><input class="input" type="email" id="email" autocomplete="email" required></div>
        <div class="field">
          <div class="split"><label for="password">Password</label><a class="small" href="#">Forgot?</a></div>
          <input class="input" type="password" id="password" autocomplete="current-password" required>
        </div>
        <label class="checkbox"><input type="checkbox"> Remember me</label>
        <button class="btn block" type="submit">Log in</button>
      </form>
    </div>
    <p class="center small muted">No account? <a href="signup.html">Sign up</a></p>
  </div>
</main>
</body>
</html>
